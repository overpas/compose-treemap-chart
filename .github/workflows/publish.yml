name: Publish

on:
  release:
    types: [released]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check release tag matches lib.version
        if: github.event_name == 'release'
        run: |
          LIB_VERSION=$(sed -n 's/^lib.version=//p' gradle.properties)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$LIB_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match lib.version=$LIB_VERSION"
            exit 1
          fi

      - name: Publish To Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USER_NAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral

      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-bundle
          path: build/maven-central/maven-central-bundle.zip
          if-no-files-found: ignore
