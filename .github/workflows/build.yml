name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: on-success
      - name: Build
        run: >-
          ./gradlew
          :treemap-chart:build
          :treemap-chart-compose:build
          :treemap-chart-views:build
          :sample:shared:allTests
          :sample:shared:compileKotlinJs
          :sample:shared:compileKotlinWasmJs
          :sample:android:assembleDebug
          :sample:android:check
          :sample:android-views:assembleDebug
          :sample:android-views:check
          :sample:desktop:build
          :sample:web:compileKotlinJs
          :sample:web-wasm:compileKotlinWasmJs
          :benchmark:compileBenchmarkKotlin
          :benchmark-views:compileBenchmarkKotlin
          :koverXmlReport
          :koverHtmlReport
          :koverLog
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-build
          path: '**/build/test-results/'
          if-no-files-found: ignore
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/kover/
          if-no-files-found: ignore

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: on-success
      - name: Build
        run: >-
          ./gradlew
          :treemap-chart:iosSimulatorArm64Test
          :treemap-chart-compose:iosSimulatorArm64Test
          :sample:shared:iosSimulatorArm64Test
          :treemap-chart:compileKotlinIosArm64
          :treemap-chart-compose:compileKotlinIosArm64
          :sample:shared:compileKotlinIosArm64
          :sample:shared:compileKotlinIosSimulatorArm64
          :treemap-chart:checkKotlinAbi
          :treemap-chart-compose:checkKotlinAbi
          validateMavenCentralBundle
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ios
          path: '**/build/test-results/'
          if-no-files-found: ignore

  androidTest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            tasks: connectedAndroidDeviceTest
          - api-level: 36
            tasks: connectedCheck connectedAndroidDeviceTest

    steps:
      - name: Delete unnecessary tools 🔧
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          android: false # Don't remove Android tools
          preinstalled-runtimes: true # Remove image tool cache - rm -rf "$AGENT_TOOLSDIRECTORY"
          dotnet: true # rm -rf /usr/share/dotnet
          haskell: true # rm -rf /opt/ghc...
          swap-storage: true # rm -f /mnt/swapfile (4GiB)
          docker-images: false # Takes 16s, enable if needed in the future
          large-packages: false # includes google-cloud-sdk and it's slow

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: Build projects and run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 6000M
          heap-size: 600M
          script: ./gradlew ${{ matrix.tasks }} --daemon